; PlatformIO — ESP32
; https://docs.platformio.org/en/latest/platforms/espressif32.html

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:esp32dev]
platform = espressif32
board = esp32dev

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

; LilyGo T-Display-S3 — LED tipicamente no GPIO 38 (ajuste em config.h se preciso)
[env:lilygo-t-display-s3]
platform = espressif32
board = lilygo-t-display-s3
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLED_GPIO=38
