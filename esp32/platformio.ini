; PlatformIO — ESP32 / PoP-SE companion
; https://docs.platformio.org/en/latest/platforms/espressif32.html

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson@^7.3.0
build_flags =
    -DCORE_DEBUG_LEVEL=3

[env:esp32dev]
platform = espressif32
board = esp32dev

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_BOOT_BTN=1

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; LilyGo T-Display-S3 — display ST7789 + botão BOOT (GPIO 0)
[env:lilygo-t-display-s3]
platform = espressif32
board = lilygo-t-display-s3
lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI@^2.5.43
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLED_GPIO=-1
    -DPOPSE_HAS_DISPLAY=1
    -DBOARD_HAS_BOOT_BTN=1
    -DBOARD_HAS_KEY_BTN=1
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DINIT_2B_1734=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_MOSI=35
    -DTFT_SCLK=36
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
