; PlatformIO — ESP32-CYD standalone (Grok + avatar)
; Board: ESP32-2432S028 (ILI9341 320x240 + XPT2046)

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson@^7.3.0
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DHAS_DISPLAY=1
    -DHAS_TOUCH=1
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=33
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000

[env:cyd]
platform = espressif32
board = esp32dev
build_flags =
    ${env.build_flags}
    -DLED_GPIO=4
    -DBOARD_HAS_BOOT_BTN=1
    -DCYD_ROTATION=1

[env:cyd-noled]
platform = espressif32
board = esp32dev
build_flags =
    ${env.build_flags}
    -DLED_GPIO=-1
    -DBOARD_HAS_BOOT_BTN=1
    -DCYD_ROTATION=1
