name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências de desenvolvimento
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check services/engine shared tests

      - name: Pytest
        run: pytest tests -v
        env:
          PYTHONPATH: services/engine:shared:services/modules/sources

  segportal-lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: segportal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            segportal/requirements-dev.txt
            segportal/services/portal-auth/requirements.txt

      - name: Instalar dependências SegPortal
        run: |
          pip install -r requirements-dev.txt
          pip install -r services/portal-auth/requirements.txt

      - name: Ruff (SegPortal)
        run: ruff check tests/

      - name: Pytest (SegPortal)
        run: pytest -v

      - name: Validar compose SegPortal
        env:
          POSTGRES_PASSWORD: ci_test_password
          LDAP_HOSTNAME: ldap.tjse.jus.br
          LDAP_USER_BASE_DN: OU=Usuarios,DC=tjse,DC=jus,DC=br
          LDAP_SEARCH_BIND_DN: CN=svc-segportal,OU=Servicos,DC=tjse,DC=jus,DC=br
          LDAP_SEARCH_BIND_PASSWORD: ci_test
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.dev.yml config --quiet

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      matrix:
        service:
          - services/engine/Dockerfile
          - services/web/Dockerfile
          - services/modules/sources/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Build imagem Docker
        run: |
          if [[ "${{ matrix.service }}" == "services/web/Dockerfile" ]]; then
            docker build -f services/web/Dockerfile services/web
          else
            docker build -f ${{ matrix.service }} .
          fi

  compose-validate:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Validar docker-compose.yml
        run: docker compose config --quiet
