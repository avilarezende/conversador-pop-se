name: CI

on:
  workflow_call:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bandit (SAST — Python)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run Bandit
        run: |
          pip install --require-hashes -r requirements-security.lock
          bandit -q -r services shared --skip B101,B110,B311 -ll -f json -o bandit.json

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Instalar dependências de desenvolvimento
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Install locked security tools
        run: pip install --require-hashes -r requirements-security.lock

      - name: Audit runtime dependencies (fail closed)
        run: pip-audit -r services/engine/requirements.lock --disable-pip --no-deps --progress-spinner off

      - name: Ruff (lint)
        run: ruff check services/engine shared tests

      - name: Pytest
        run: pytest tests -v
        env:
          PYTHONPATH: services/engine:shared:services/modules/sources

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      matrix:
        service:
          - services/engine/Dockerfile
          - services/web/Dockerfile
          - services/modules/sources/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build imagem Docker
        run: |
          if [[ "${{ matrix.service }}" == "services/web/Dockerfile" ]]; then
            docker build -f services/web/Dockerfile services/web
          else
            docker build -f ${{ matrix.service }} .
          fi

  compose-validate:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validar docker-compose.yml
        env:
          DATABASE_URL: postgresql+asyncpg://validation:validation@postgres:5432/conversador
          POSTGRES_PASSWORD: validation-only
          ENGINE_API_TOKEN: validation-only
        run: docker compose config --no-env-resolution --quiet
