name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bandit (SAST — Python)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Bandit
        run: |
          pip install bandit
          bandit -q -r services shared --skip B101,B110,B311 -f sarif -o bandit.sarif || true

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências de desenvolvimento
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check services/engine shared tests

      - name: Pytest
        run: pytest tests -v
        env:
          PYTHONPATH: services/engine:shared:services/modules/sources

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      matrix:
        service:
          - services/engine/Dockerfile
          - services/web/Dockerfile
          - services/modules/sources/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Build imagem Docker
        run: |
          if [[ "${{ matrix.service }}" == "services/web/Dockerfile" ]]; then
            docker build -f services/web/Dockerfile services/web
          else
            docker build -f ${{ matrix.service }} .
          fi

  compose-validate:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Validar docker-compose.yml
        run: docker compose config --quiet
