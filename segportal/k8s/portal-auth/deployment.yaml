apiVersion: v1
kind: Service
metadata:
  name: portal-auth
  labels:
    app.kubernetes.io/name: portal-auth
    app.kubernetes.io/component: portal
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8090
      targetPort: 8090
  selector:
    app.kubernetes.io/name: portal-auth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-auth
  labels:
    app.kubernetes.io/name: portal-auth
    app.kubernetes.io/component: portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-auth
        app.kubernetes.io/component: portal
    spec:
      containers:
        - name: portal-auth
          image: registry.aqne.jus.br/segportal/portal-auth:latest
          ports:
            - containerPort: 8090
              name: http
          env:
            - name: PORTAL_PORT
              value: "8090"
            - name: GUACAMOLE_PUBLIC_URL
              value: http://guacamole:8080/guacamole
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
